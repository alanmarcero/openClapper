name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/OpenClapper_artefacts/Release

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openClapper.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openClapper.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openClapper.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openClapper.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openClapper.vst3" "dist/openClapper.vst3"
          ditto "$ARTEFACTS/AU/openClapper.component" "dist/openClapper.component"
          ditto "$ARTEFACTS/LV2/openClapper.lv2" "dist/openClapper.lv2"
          ditto "$ARTEFACTS/Standalone/openClapper.app" "dist/openClapper.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openClapper-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openClapper-macOS
          path: openClapper-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openClapper.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openClapper.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openClapper.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openClapper.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openClapper-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openClapper-Windows
          path: openClapper-Windows.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openClapper.vst3" "$ARTEFACTS/LV2/openClapper.lv2" dist/
          cp "$ARTEFACTS/Standalone/openClapper" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openClapper-Linux.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: openClapper-Linux
          path: openClapper-Linux.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: openClapper-*.zip
          generate_release_notes: true
