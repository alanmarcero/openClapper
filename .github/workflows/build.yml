name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/OpenClapper_artefacts/Release

jobs:
  macos:
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openClapper.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openClapper.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openClapper.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openClapper.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openClapper.vst3" "dist/openClapper.vst3"
          ditto "$ARTEFACTS/AU/openClapper.component" "dist/openClapper.component"
          ditto "$ARTEFACTS/LV2/openClapper.lv2" "dist/openClapper.lv2"
          ditto "$ARTEFACTS/Standalone/openClapper.app" "dist/openClapper.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openClapper-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openClapper-macOS
          path: openClapper-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openClapper.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openClapper.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openClapper.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openClapper.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openClapper-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openClapper-Windows
          path: openClapper-Windows.zip

  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openClapper.vst3" "$ARTEFACTS/LV2/openClapper.lv2" dist/
          cp "$ARTEFACTS/Standalone/openClapper" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openClapper-Linux.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: openClapper-Linux
          path: openClapper-Linux.zip

  # Captures the factory-default editor into docs/screenshots/preview.png.
  # The macOS and Linux package jobs stay disabled; this job does not depend on them.
  update-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build editor tests
        run: cmake --build build --config Release --parallel --target openclapper_plugin_tests

      - name: Capture editor
        run: |
          mkdir -p build/shots
          OPENCLAPPER_SCREENSHOTS="$PWD/build/shots" xvfb-run -a ./build/openclapper_plugin_tests '[plugin][gui]'
          cp build/shots/openClapper-screenshot.png docs/screenshots/preview.png

      - name: Commit preview
        run: |
          git add docs/screenshots/preview.png
          if git diff --cached --quiet; then
            echo "Editor preview is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh editor preview"
          git pull --rebase origin main
          git push origin HEAD:main

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') && (needs.linux.result == 'skipped' || needs.linux.result == 'success') }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Notes come from the tagged CHANGELOG section, or from the tag message
      # when that section is absent. A lightweight tag uses its commit message.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Write release body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(python3 scripts/release_notes.py "$TAG")
          screenshot="![openClapper editor](https://raw.githubusercontent.com/alanmarcero/openClapper/${TAG}/docs/screenshots/preview.png)"
          {
            if [ -n "$notes" ]; then
              printf '%s\n\n' "$notes"
            fi
            printf '%s\n' "$screenshot"
          } > "$RUNNER_TEMP/release-body.md"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-body.md
          files: openClapper-*.zip
          generate_release_notes: true
